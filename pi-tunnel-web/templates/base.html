<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1117">
    <script>
    (function(){var t=localStorage.getItem('pi-tunnel-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#0f1117':'#f6f8fa');})();
    </script>
    <title>{% block title %}Pi Tunnel{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo-link">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="logo" width="32" height="32">
                <h1>Pi Tunnel</h1>
            </a>
            <div class="header-actions">
                {% if current_user %}
                <span class="header-user">{{ current_user.username }} <em>({{ current_user.role }})</em></span>
                {% if current_user.role == 'admin' %}
                <a href="{{ url_for('users_page') }}" class="header-link">Users</a>
                {% endif %}
                <form method="post" action="{{ url_for('logout') }}" class="header-logout-form">
                    <button type="submit" class="header-logout-btn">Logout</button>
                </form>
                {% endif %}
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode" aria-pressed="false" title="Toggle theme">
                    <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
                    <span class="theme-icon theme-icon-moon" aria-hidden="true">☽</span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="site-footer">
        <div class="container">
            <a href="https://github.com/miladkhalafi/pi-tunnel" target="_blank" rel="noopener noreferrer" class="footer-link">github.com/miladkhalafi/pi-tunnel</a> · MIT License
        </div>
    </footer>
    <script>
    (function() {
        const STORAGE_KEY = 'pi-tunnel-theme';
        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function getPreferredTheme() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored === 'light' || stored === 'dark') return stored;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            toggle?.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0f1117' : '#f6f8fa');
        }

        setTheme(getPreferredTheme());

        toggle?.addEventListener('click', () => {
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem(STORAGE_KEY, next);
            setTheme(next);
        });
    })();
    </script>
</body>
</html>
