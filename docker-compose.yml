# Run the Pi tunnel SSH server and web UI on your host
# 1. Set IMAGE and WEB_IMAGE in .env (or use defaults)
# 2. Set SERVER_URL (e.g. https://your-server.com) for registration links
# 3. docker compose up -d

services:
  pi-tunnel:
    image: ${IMAGE:-ghcr.io/miladkhalafi/pi-tunnel-sshd:latest}
    container_name: pi-tunnel
    restart: unless-stopped
    depends_on:
      - pi-tunnel-web
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "2222:22"
      - "10022:10022"
      - "10023:10023"
      - "10024:10024"
      - "10025:10025"
      - "10026:10026"
      - "10027:10027"
      - "10028:10028"
      - "10029:10029"
      - "10030:10030"
      - "10031:10031"
    volumes:
      - ./data/authorized_keys:/home/pitunnel/.ssh/authorized_keys

  pi-tunnel-web:
    image: ${WEB_IMAGE:-ghcr.io/miladkhalafi/pi-tunnel-web:latest}
    container_name: pi-tunnel-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - SERVER_URL=${SERVER_URL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DB_PATH=/app/data/pi_tunnel.db
      - AUTHORIZED_KEYS_PATH=/app/data/authorized_keys
      - SSH_PRIVATE_KEY_PATH=${SSH_PRIVATE_KEY_PATH:-/app/.ssh/id_ed25519}
      - SSH_HOST=pi-tunnel
      - SSH_USERNAME=${SSH_USERNAME:-pi}
      - SSH_SERVER_PORT=${SSH_SERVER_PORT:-2222}
      - PORT_START=${PORT_START:-10022}
      - PORT_COUNT=${PORT_COUNT:-10}
    volumes:
      - ./data:/app/data
      # Optional: mount your own key for web terminal (default: auto-generated in ./data/.ssh/)
      # - ./keys:/app/.ssh:ro
