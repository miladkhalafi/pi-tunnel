name: Build and push Pi tunnel images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-sshd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pi-tunnel-sshd
        uses: docker/build-push-action@v5
        with:
          context: ./pi-tunnel-sshd
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pi-tunnel-sshd:latest
            ghcr.io/${{ github.repository_owner }}/pi-tunnel-sshd:${{ github.sha }}

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pi-tunnel-web
        uses: docker/build-push-action@v5
        with:
          context: ./pi-tunnel-web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pi-tunnel-web:latest
            ghcr.io/${{ github.repository_owner }}/pi-tunnel-web:${{ github.sha }}
